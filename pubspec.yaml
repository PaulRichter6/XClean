name: xclean
description: "Open-source, privacy-first mobile companion app for Oclean X Pro Elite smart toothbrush."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.1.2
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  flutter_local_notifications: ^22.3.3
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
